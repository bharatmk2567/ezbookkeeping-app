name: Release APK from Upstream

on:
  schedule:
    # Check for new upstream releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if no new upstream changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/mayswind/ezbookkeeping.git
  RELEASE_PREFIX: upstream

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get upstream status
        id: upstream
        run: |
          git ls-remote $UPSTREAM_URL refs/heads/main > /tmp/upstream_sha.txt
          UPSTREAM_SHA=$(cut -f1 /tmp/upstream_sha.txt)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "Upstream main HEAD: $UPSTREAM_SHA"

          # Latest upstream release tag (for naming / release notes)
          RESPONSE=$(curl -s "https://api.github.com/repos/mayswind/ezbookkeeping/releases/latest")
          LATEST_TAG=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Latest upstream release: ${LATEST_TAG:-none}"

      - name: Check if upstream main changed
        id: check
        run: |
          # We tag our repo with "upstream-<sha>" after each build
          EXISTING=$(git tag -l "${RELEASE_PREFIX}-${UPSTREAM_SHA:0:12}")
          if [ -n "$EXISTING" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Upstream main $UPSTREAM_SHA already built (tag: $EXISTING). Nothing to do."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New upstream code detected: $UPSTREAM_SHA"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: steps.check.outputs.skip == 'false'
        uses: android-actions/setup-android@v3

      - name: Clone upstream
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 $UPSTREAM_URL /tmp/upstream
          echo "Cloned upstream at $UPSTREAM_SHA"

      - name: Copy upstream files into app/
        if: steps.check.outputs.skip == 'false'
        run: |
          COPY_ITEMS=(
            "src"
            "package.json"
            "package-lock.json"
            "vite.config.ts"
            "tsconfig.json"
            "eslint.config.mjs"
            "postcss.config.js"
            "vitest.config.ts"
            "public"
            "LICENSE"
            "contributors.json"
            "third-party-dependencies.json"
          )

          for item in "${COPY_ITEMS[@]}"; do
            if [ -e "/tmp/upstream/$item" ]; then
              rm -rf "app/$item"
              cp -r "/tmp/upstream/$item" "app/$item"
              echo "Updated: $item"
            fi
          done

      - name: Apply Capacitor modifications (3-way merge)
        if: steps.check.outputs.skip == 'false'
        run: |
          bash scripts/sync-capacitor-mods.sh /tmp/upstream

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        working-directory: app
        run: |
          npm install
          bash ../scripts/install-capacitor-deps.sh

      - name: Build web assets
        if: steps.check.outputs.skip == 'false'
        working-directory: app
        run: NODE_ENV=production npx vite build

      - name: Sync Capacitor
        if: steps.check.outputs.skip == 'false'
        working-directory: app
        run: npx cap sync android

      - name: Build Android debug APK
        if: steps.check.outputs.skip == 'false'
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Prepare APK for release
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          SOURCE_APK="app/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="ezBookkeeping-${VERSION}-debug.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::APK not found at $SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" "$RELEASE_APK"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "Prepared: $RELEASE_APK ($(du -h "$RELEASE_APK" | cut -f1))"

      - name: Commit synced code
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream ezBookkeeping $UPSTREAM_SHA" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag release
        if: steps.check.outputs.skip == 'false'
        run: |
          git tag "${RELEASE_PREFIX}-${UPSTREAM_SHA:0:12}"
          git push origin "${RELEASE_PREFIX}-${UPSTREAM_SHA:0:12}"

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release_notes.md <<'EOF'
          ## ezBookkeeping Android App

          Automatically built from the latest ezBookkeeping upstream code.

          - **Upstream commit:** `{UPSTREAM_SHA}`
          - **Upstream release:** `{LATEST_TAG}`

          ### Download
          - **{RELEASE_APK}** — Android debug APK (unsigned, sideload-friendly)

          ### What's inside
          - Full ezBookkeeping web app (all features)
          - Native Capacitor shell
          - Camera (receipt scanning), biometric unlock, notifications, geolocation

          ### Install
          1. Download the APK
          2. Enable "Install unknown apps" for your browser/file manager
          3. Open the APK and install

          > Note: This is a **debug build** using the Android debug keystore. For Play Store distribution, a signed release build is required.

          ---
          *Automated by GitHub Actions*
          EOF
          sed -i "s/{RELEASE_APK}/${RELEASE_APK}/g; s/{UPSTREAM_SHA}/${UPSTREAM_SHA}/g; s/{LATEST_TAG}/${LATEST_TAG}/g" /tmp/release_notes.md
          gh release create "${RELEASE_PREFIX}-${UPSTREAM_SHA:0:12}" \
            "$RELEASE_APK" \
            --title "ezBookkeeping Android App (upstream ${UPSTREAM_SHA:0:12})" \
            --notes-file /tmp/release_notes.md

      - name: Already up to date
        if: steps.check.outputs.skip == 'true'
        run: echo "Latest upstream code already packaged. No action taken."
