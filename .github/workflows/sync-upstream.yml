name: Sync Upstream ezBookkeeping

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no changes detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/mayswind/ezbookkeeping.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone upstream
        run: |
          git clone --depth 50 $UPSTREAM_URL /tmp/upstream
          UPSTREAM_SHA=$(cd /tmp/upstream && git rev-parse --short HEAD)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "Upstream latest: $UPSTREAM_SHA"

      - name: Backup Capacitor modifications
        run: |
          BACKUP_DIR="/tmp/backup_$(date +%s)"
          mkdir -p "$BACKUP_DIR"

          CUSTOM_FILES=(
            "src/lib/capacitor.ts"
            "src/MobileApp.vue"
            "src/core/setting.ts"
            "src/stores/setting.ts"
            "src/views/mobile/transactions/EditPage.vue"
            "src/views/mobile/ApplicationLockPage.vue"
            "src/views/mobile/UnlockPage.vue"
            "src/components/mobile/AIImageRecognitionSheet.vue"
            "capacitor.config.ts"
          )

          for file in "${CUSTOM_FILES[@]}"; do
            if [ -f "app/$file" ]; then
              mkdir -p "$BACKUP_DIR/$(dirname "$file")"
              cp "app/$file" "$BACKUP_DIR/$file"
            fi
          done

          echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_ENV
          echo "Backup saved to: $BACKUP_DIR"

      - name: Copy upstream files
        run: |
          COPY_ITEMS=(
            "src"
            "package.json"
            "package-lock.json"
            "vite.config.ts"
            "tsconfig.json"
            "eslint.config.mjs"
            "postcss.config.js"
            "vitest.config.ts"
            "public"
            "LICENSE"
            "contributors.json"
            "third-party-dependencies.json"
          )

          for item in "${COPY_ITEMS[@]}"; do
            if [ -e "/tmp/upstream/$item" ]; then
              rm -rf "app/$item"
              cp -r "/tmp/upstream/$item" "app/$item"
              echo "Updated: $item"
            fi
          done

      - name: Restore Capacitor modifications
        run: |
          for file in \
            "src/lib/capacitor.ts" \
            "src/MobileApp.vue" \
            "src/core/setting.ts" \
            "src/stores/setting.ts" \
            "src/views/mobile/transactions/EditPage.vue" \
            "src/views/mobile/ApplicationLockPage.vue" \
            "src/views/mobile/UnlockPage.vue" \
            "src/components/mobile/AIImageRecognitionSheet.vue" \
            "capacitor.config.ts"
          do
            if [ -f "$BACKUP_DIR/$file" ]; then
              mkdir -p "$(dirname "app/$file")"
              cp "$BACKUP_DIR/$file" "app/$file"
              echo "Restored: $file"
            fi
          done

      - name: Check for real changes
        id: check
        run: |
          # Anything different from our committed baseline now?
          STATUS=$(git status --porcelain -- app/ | grep -v node_modules || true)
          if [ -z "$STATUS" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected. Repository is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            echo "$STATUS"
          fi

      - name: Install dependencies
        if: steps.check.outputs.has_changes == 'true'
        working-directory: app
        run: npm install

      - name: Build web assets
        if: steps.check.outputs.has_changes == 'true'
        working-directory: app
        run: NODE_ENV=production npx vite build

      - name: Sync Capacitor
        if: steps.check.outputs.has_changes == 'true'
        working-directory: app
        run: npx cap sync android

      - name: Build Android APK
        if: steps.check.outputs.has_changes == 'true'
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Verify build
        if: steps.check.outputs.has_changes == 'true'
        run: |
          APK_PATH="app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "APK built successfully: $APK_SIZE"
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream ezBookkeeping (${{ env.UPSTREAM_SHA }})"
          branch: "sync/upstream-${{ env.UPSTREAM_SHA }}"
          delete-branch: true
          base: main
          title: "chore: sync upstream ezBookkeeping (${{ env.UPSTREAM_SHA }})"
          body: |
            ## Upstream Sync

            This PR syncs changes from [ezBookkeeping](https://github.com/mayswind/ezbookkeeping) upstream.

            **Upstream commit:** `${{ env.UPSTREAM_SHA }}`

            ### What was done
            - Pulled latest source from upstream
            - Backed up Capacitor modifications
            - Copied upstream files
            - Restored Capacitor modifications
            - Rebuilt web assets
            - Synced to Android
            - Verified APK builds successfully

            ### Modified files preserved
            - `src/lib/capacitor.ts` — Native feature bridge
            - `src/MobileApp.vue` — Capacitor initialization
            - `src/core/setting.ts` — Biometric setting
            - `src/stores/setting.ts` — Biometric store method
            - `src/views/mobile/transactions/EditPage.vue` — Native camera
            - `src/views/mobile/ApplicationLockPage.vue` — Biometric toggle
            - `src/views/mobile/UnlockPage.vue` — Biometric unlock
            - `src/components/mobile/AIImageRecognitionSheet.vue` — Native camera for AI

            ### Testing
            - [ ] Build succeeds
            - [ ] APK generated
            - [ ] All features work
            - [ ] No merge conflicts

            ---
            *Automated sync by GitHub Actions*
          labels: |
            sync
            upstream

      - name: No changes detected
        if: steps.check.outputs.has_changes == 'false'
        run: echo "No upstream changes to sync. Repository is up to date."
